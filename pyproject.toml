[project]
name = "mira"
description = "Make websites accessible for AI agents"
authors = [{ name = "Maham" }]
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.11,<4.0"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    # Core HTTP & Async
    "aiohttp==3.13.3",
    "anyio==4.12.1",
    "httpx==0.28.1",
    "requests==2.32.5",
    
    # Utilities
    "pydantic==2.12.5",
    "pydantic-settings==2.12.0",
    "python-dotenv==1.2.1",
    "typing-extensions==4.15.0",
    "uuid7==0.1.0",
    
    # Core LLM Providers (as defined in browser-use)
    "openai==2.16.0",
    "anthropic==0.76.0",
    "google-genai==1.65.0",
    
    # DOM interaction
    "playwright==1.50.0",
    "bubus==1.5.6",
    "cdp-use==1.4.5",
    
    # Telemetry and Utilities
    "posthog==7.7.0",
    "screeninfo==0.8.1; platform_system != 'darwin'",
    "pyobjc==12.1; platform_system == 'darwin'",
    "psutil==6.1.1",
    "pyotp==2.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["system", "api"]

[tool.ruff]
line-length = 130
fix = true

[tool.ruff.format]
quote-style = "single"
indent-style = "tab"

[tool.pytest.ini_options]
timeout = 300
asyncio_mode = "auto"
testpaths = ["tests"]
